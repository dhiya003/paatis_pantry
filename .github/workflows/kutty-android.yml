name: Kutty Samayal APK
on:
  push:
    branches: [kutty-samayal-android]
    paths: ['kutty-android/**', '.github/workflows/kutty-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kutty-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install and verify meal planner
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          mkdir -p native/app/src/main/assets
          cp -R dist/. native/app/src/main/assets/
      - name: Build installable APK and Android tests
        run: gradle -p native assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kutty-samayal-apk
          path: kutty-android/native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline Android launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p kutty-android/native connectedDebugAndroidTest --no-daemon
            adb install -r kutty-android/native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.verve.kuttysamayal/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/kutty.png
            adb pull /sdcard/kutty.png kutty-android/android-preview.png
      - name: Upload device checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kutty-android-checks
          path: |
            kutty-android/native/app/build/reports/androidTests
            kutty-android/android-preview.png
            kutty-android/package-lock.json
          retention-days: 14
