name: Kutty wake acoustic checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acoustic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kutty-android
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install sherpa-onnx==1.13.8 piper-tts==1.4.2 numpy==2.2.6
      - run: python3 scripts/prepare-wake.py
      - run: python3 scripts/wake-acoustic-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-acoustic-results
          path: |
            kutty-android/wake-acoustic-results.json
            kutty-android/wake-fixtures
